LogLevel info
MaxLogSize 0
# Write printers.conf at once: the default 30 s delay lost the queue (and its UUID) on restart.
DirtyCleanInterval 0
Listen 0.0.0.0:631
ServerAlias *
DefaultEncryption Never
Browsing Yes
BrowseLocalProtocols dnssd
DefaultShared Yes
DefaultAuthType None
WebInterface Yes
<Location />
  Order allow,deny
  Allow all
</Location>
<Location /admin>
  Order allow,deny
  Allow localhost
</Location>
<Policy default>
  <Limit All>
    Order allow,deny
    Allow all
  </Limit>
</Policy>
