[server]
use-ipv4=yes
use-ipv6=no
# Only the LAN interface: otherwise the service is also published on docker0 and every bridge.
allow-interfaces=eth0
ratelimit-interval-usec=1000000
ratelimit-burst=1000

[wide-area]
enable-wide-area=no

[publish]
# Only the printer service (+ the host A record its SRV points to).
publish-workstation=no
# No AAAA: CUPS listens on IPv4 only, and Windows tried the advertised fe80:: address first
# (~4 s per connection by name until it fell back to IPv4).
publish-aaaa-on-ipv4=no
publish-hinfo=no
publish-domain=no

[reflector]
enable-reflector=no
